# Legacy manual workflow. Automatic scheduling moved to the standalone tool.
name: Bot 2 - Daily TLS certificate checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cert_expiry-bot
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CERT_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CERT_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/cert_expiry_bot.py --warn-days 30
