services:
  - type: web
    name: jyoticve
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install '.[hosted]'
    startCommand: gunicorn --config deploy/gunicorn.conf.py 'jyoticve.hosted:create_app()'
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: JYOTICVE_ADMIN_USER
        value: admin
      - key: JYOTICVE_ADMIN_PASSWORD
        generateValue: true
