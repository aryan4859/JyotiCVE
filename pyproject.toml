[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jyoticve"
version = "1.0.0"
description = "Independent scheduled security intelligence, TLS, and stack monitoring bots"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.4,<3", "cryptography>=42,<51", "packaging>=24,<27", "python-dotenv>=1,<2"]

[project.optional-dependencies]
hosted = ["Flask>=3.1,<4", "gunicorn>=23,<26", "psycopg[binary]>=3.2,<4"]

[project.scripts]
jyoticve = "jyoticve.cli:main"

[tool.setuptools.packages.find]
include = ["jyoticve*"]

[tool.setuptools.package-data]
jyoticve = ["static/*.html", "static/*.css", "static/*.js", "default-config.json"]
