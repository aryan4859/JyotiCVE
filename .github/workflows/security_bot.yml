name: Cybersecurity Intel & Dependency Alert Bot

on:
  schedule:
    # Runs every 6 hours (At minute 0 past hour 0, 6, 12, and 18)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Tools & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y whatweb
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Correlation & Telegram Bot Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python .github/scripts/sec_bot.py --file .github/scripts/requirements.txt --domain jbbl.com.np
