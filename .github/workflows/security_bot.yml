name: Cybersecurity Intel & CVE Alert Bot

on:
  schedule:
    # Runs every 6 hours (At minute 0 past hour 0, 6, 12, and 18)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run CVE Correlation & Telegram Bot Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: raises NVD's rate limit from 5 to 50 requests/30s.
          # NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python .github/scripts/sec_bot.py --domain jbbl.com.np --hours 6
